name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project + dev tools
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project + dev tools
        run: pip install -e ".[dev]"

      # Linters are report-only for now: the codebase has partial type hints.
      # Drop `continue-on-error` once ruff/mypy are clean to make them gates.
      - name: Ruff
        continue-on-error: true
        run: ruff check droidnet tests

      - name: Mypy
        continue-on-error: true
        run: mypy droidnet
