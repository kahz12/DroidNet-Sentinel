# Runs the checks from the README's "Development" section on every push to
# main and on every pull request: the test suite on each supported Python
# version, plus ruff and vulture once. The suite simulates scans, packets and
# external APIs, so it needs no nmap, no root and no network access.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result instead of stopping at the first failure.
      fail-fast: false
      matrix:
        # 3.10 is the oldest version the project supports.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  lint:
    name: Lint (ruff, vulture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: ruff
        run: python -m ruff check droidnet main.py tests --select F,E9,B
      - name: vulture
        run: python -m vulture droidnet main.py --min-confidence 80
